name: pg-to-clickhouse-lab
services:
  postgres:
    image: postgres:16.9-alpine
    environment:
      POSTGRES_DB: lab
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: local-lab
    command: ['postgres', '-c', 'wal_level=logical', '-c', 'max_slot_wal_keep_size=4GB', '-c', 'max_parallel_workers_per_gather=2']
    ports: ['127.0.0.1:55438:5432']
    volumes:
      - pg:/var/lib/postgresql/data
      - ./sql/postgres.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U lab -d lab']
      interval: 2s
      timeout: 2s
      retries: 60
  clickhouse:
    image: clickhouse/clickhouse-server:25.8.4.13
    environment:
      CLICKHOUSE_USER: lab
      CLICKHOUSE_PASSWORD: local-lab
      CLICKHOUSE_DB: lab
    ports: ['127.0.0.1:58138:8123']
    volumes:
      - ch:/var/lib/clickhouse
      - ./sql/clickhouse.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'clickhouse-client --user lab --password local-lab --query "EXISTS lab.versions" | grep -qx 1']
      interval: 2s
      timeout: 2s
      retries: 60
volumes:
  pg:
  ch:
